<!doctype html>
<html lang="{{ ui_lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t('Upload Photos') }}</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='guest.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='upload_form.css') }}"></head>
<body>
<main>
  <header>
    <a class="wordmark" href="/wall">Photowall</a>
    <nav class="actions" aria-label="{{ t('Display') }}">
      <a href="/wall">{{ t('Photo wall') }}</a>
      <a href="/slideshow">{{ t('Slideshow') }}</a>
      {% include 'appearance_controls.html' %}
    </nav>
  </header>
  <h1>{{ t('Add photos') }}</h1>
  <form id="uploadForm">
    <label>{{ t('Photos') }}
      <input id="file" name="file" type="file" accept="image/*" aria-describedby="photo-formats" multiple required>
      <span id="photo-formats" class="muted">{{ t('JPG, PNG, GIF or WebP · Up to 10 MB per photo') }}</span>
    </label>
    <label>{{ t('Caption for all photos (optional, 40 characters)') }}
      <input id="caption" name="caption" maxlength="40" placeholder="{{ t('e.g. Couple on stage') }}">
    </label>
    <label>{{ t('PIN (if required)') }}
      <input id="pin" type="password" maxlength="64" autocomplete="off" placeholder="{{ t('Enter upload PIN') }}">
    </label>
    <button id="uploadSubmit" class="primary" type="submit">{{ t('Upload photos') }}</button>
    <div id="status" role="status"></div>
    <ul id="uploadIssues" hidden></ul>
  </form>
  <a class="archive muted" href="/download">{{ t('Download ZIP') }}</a>
</main>
{% include 'ui_scripts.html' %}
<script src="{{ url_for('static', filename='upload_form.js') }}"></script>
</body></html>
