<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body>
<header>
  <h1>{{ t('Admin') }}</h1>
  <div class="admin-nav">
    <a href="/" class="muted">{{ t('Home') }}</a>
