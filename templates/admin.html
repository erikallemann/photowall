<!doctype html>
<html lang="{{ ui_lang }}" data-default-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('Admin Photowall') }}</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='guest.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body>
<header>
  <nav class="admin-nav" aria-label="{{ t('Main') }}">
    <h1>{{ t('Admin') }}</h1>
    <a href="/" class="muted">{{ t('Home') }}</a>
    <a href="/wall" class="muted">{{ t('Wall') }}</a>
    {% include 'appearance_controls.html' %}
  </nav>
  <div class="admin-tools">
    {% if can_remove %}
    <input id="pin" placeholder="{{ t('Admin PIN') }}" aria-label="{{ t('Admin PIN') }}" type="password" autocomplete="off">
    <button id="save" type="button">{{ t('Save PIN') }}</button>
    {% else %}
    <span class="muted">{{ t('Photo removal is unavailable here.') }}</span>
    {% endif %}
    <button id="refresh" type="button">{{ t('Refresh') }}</button>
    <button id="toggle" type="button">{{ t('Auto: On') }}</button>
  </div>
</header>
<main>
  <p id="status" class="muted"></p>
  <p id="actionStatus" role="status"></p>
  <div id="grid" class="grid"></div>
</main>
{% include 'ui_scripts.html' %}
<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body></html>
